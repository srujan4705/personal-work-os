# BACKUP trigger for scheduled jobs. The PRIMARY trigger should be an external cron service
# every 5 minutes (see docs/FREE_TIER_DEPLOYMENT.md): GitHub schedules are best-effort and
# frequent runs would exceed the free Actions minutes of a private repository.
name: Scheduled jobs (backup trigger)
on:
  schedule:
    - cron: "7 * * * *" # hourly, UTC
  workflow_dispatch:
    inputs:
      scope:
        description: all | notifications | sync
        default: all

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Trigger cron endpoint
        env:
          CRON_TICK_URL: ${{ secrets.CRON_TICK_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SCOPE: ${{ github.event.inputs.scope || 'all' }}
        run: |
          if [ -z "$CRON_TICK_URL" ] || [ -z "$CRON_SECRET" ]; then echo "Set CRON_TICK_URL and CRON_SECRET secrets"; exit 1; fi
          # --retry covers Render cold starts; the response body contains no secrets.
          curl --fail-with-body --silent --show-error --max-time 300 --retry 3 --retry-delay 20 --retry-all-errors \
            -X POST -H "Authorization: Bearer $CRON_SECRET" "$CRON_TICK_URL?scope=$SCOPE"
