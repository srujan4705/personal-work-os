name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pwos
          POSTGRES_PASSWORD: pwos
          POSTGRES_DB: pwos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pwos -d pwos_test" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://pwos:pwos@localhost:5432/pwos_test
      TEST_DATABASE_URL: postgresql://pwos:pwos@localhost:5432/pwos_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
